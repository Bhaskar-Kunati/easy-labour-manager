openapi: 3.0.3
info:
  title: Auth Service API - Customer Login
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      summary: Customer login with mobile number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobileNumber
                - password
              properties:
                mobileNumber:
                  type: string
                  example: "+1234567890"
                password:
                  type: string
                  format: password
                  example: "SecurePassword123"
      responses:
        '200':
          description: Successful authentication returning JWT token and user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        '400':
          description: Invalid request or validation failure
        '401':
          description: Unauthorized (invalid credentials, suspended, or blocked account)
        '503':
          description: Service Unavailable (database or downstream dependency error)
