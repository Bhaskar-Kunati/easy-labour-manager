openapi: 3.0.3
info:
  title: Auth Service API - Mobile OTP Verification
  version: 1.0.0
paths:
  /api/v1/auth/send-otp:
    post:
      summary: Send OTP to customer mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobileNumber
              properties:
                mobileNumber:
                  type: string
                  example: "+1234567890"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP sent successfully"
        '400':
          description: Bad Request (malformed input or unknown mobile number)
        '503':
          description: Service Unavailable (OTP provider or database failure)

  /api/v1/auth/verify-otp:
    post:
      summary: Verify OTP and mark customer mobile as verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobileNumber
                - otp
              properties:
                mobileNumber:
                  type: string
                  example: "+1234567890"
                otp:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OTP verified successfully"
        '400':
          description: Bad Request (invalid OTP, expired OTP, unknown mobile, or missing input)
        '503':
          description: Service Unavailable (database failure)
