openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.0.0
  description: API for managing service booking payments using MockPaymentGateway.
paths:
  /api/v1/payments/create-order:
    post:
      summary: Create payment order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Payment order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /api/v1/payments/verify:
    post:
      summary: Verify payment transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Payment verified successfully
          content:
            application/json:
              schema:
                type: boolean
  /api/v1/payments/status/{bookingId}:
    get:
      summary: Get payment status by booking ID
      security:
        - BearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderRequest:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
    VerifyRequest:
      type: object
      properties:
        paymentId:
          type: string
        gatewayPaymentId:
          type: string
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookingId:
          type: integer
          format: int64
        customerId:
          type: string
        paymentGateway:
          type: string
        gatewayOrderId:
          type: string
        gatewayPaymentId:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        status:
          type: string
        paymentMethod:
          type: string
        gatewayResponse:
          type: string
        createdAt:
          type: string
          format: date-time
