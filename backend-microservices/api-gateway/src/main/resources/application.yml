server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/v1/auth/$\{segment}
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**, /customers/**, /workers/**, /addresses/**
          filters:
            - RewritePath=/(users|customers|workers|addresses)/(?<segment>.*), /api/v1/$\{segment}
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/bookings/**, /admin/bookings/**, /admin/coupons/**, /workers/bookings/**
          filters:
            - RewritePath=/(bookings|admin/bookings|admin/coupons|workers/bookings)/(?<segment>.*), /api/v1/$\{segment}
        - id: catalog-service
          uri: http://localhost:8088
          predicates:
            - Path=/catalog/**, /categories/**, /services/**, /admin/catalog/**
          filters:
            - RewritePath=/(catalog|categories|services|admin/catalog)/(?<segment>.*), /api/v1/$\{segment}
        - id: tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=/tracking/**
          filters:
            - RewritePath=/tracking/(?<segment>.*), /api/tracking/$\{segment}
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**
          filters:
            - RewritePath=/payments/(?<segment>.*), /api/v1/payments/$\{segment}
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/notifications/**
          filters:
            - RewritePath=/notifications/(?<segment>.*), /api/v1/notifications/$\{segment}
        - id: review-service
          uri: http://localhost:8087
          predicates:
            - Path=/reviews/**, /support/**
          filters:
            - RewritePath=/(reviews|support)/(?<segment>.*), /api/v1/reviews/$\{segment}
        - id: wallet-service
          uri: http://localhost:8089
          predicates:
            - Path=/wallet/balance, /wallet/transactions, /wallet/topup/**, /wallet/payouts/**, /admin/wallets/**
          filters:
            - RewritePath=/(wallet|admin/wallets)/(?<segment>.*), /api/wallet/$\{segment}
        - id: admin-service
          uri: http://localhost:8090
          predicates:
            - Path=/admin/analytics/**, /admin/payouts/**
          filters:
            - RewritePath=/admin/(?<segment>.*), /api/v1/admin/$\{segment}
