server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /api/users/$\{segment}
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/bookings/**
        - id: tracking-service
          uri: http://localhost:8084
          predicates:
            - Path=/tracking/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/notifications/**
        - id: review-service
          uri: http://localhost:8087
          predicates:
            - Path=/reviews/**
