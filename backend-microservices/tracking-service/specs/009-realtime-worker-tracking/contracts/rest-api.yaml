openapi: 3.0.3
info:
  title: Tracking Service API
  version: 1.0.0
  description: API for worker location updates and customer tracking history in Easy Labour Manager.
paths:
  /api/tracking/update:
    post:
      summary: Submit worker/system location update
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingEvent'
      responses:
        '200':
          description: Location update successfully processed, persisted, and broadcasted.
        '400':
          description: Validation error (invalid coordinates or missing booking ID).
        '401':
          description: Unauthorized / unauthenticated request.
        '403':
          description: Forbidden (ineligible booking state or unauthorized actor).

  /api/tracking/history/{bookingId}:
    get:
      summary: Retrieve location history for a booking
      security:
        - BearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location history retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationHistory'
        '401':
          description: Unauthenticated request.
        '403':
          description: Forbidden (customer does not own booking or booking state ineligible).
        '404':
          description: Booking not found.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TrackingEvent:
      type: object
      required:
        - bookingId
        - latitude
        - longitude
      properties:
        bookingId:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
        longitude:
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0
        timestamp:
          type: string
          format: date-time

    LocationHistory:
      type: object
      properties:
        id:
          type: string
        bookingId:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
