openapi: 3.0.3
info:
  title: Notification API - Notification Service
  version: 1.0.0
  description: API for authenticated customers to view and manage in-app notifications.
paths:
  /api/v1/notifications:
    get:
      summary: Get notifications for the authenticated customer (ordered newest first)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of notifications (or empty list)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthorized
  /api/v1/notifications/{id}/read:
    put:
      summary: Mark a notification as read
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Notification marked as read successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (accessing another customer's notification)
        '404':
          description: Notification not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        message:
          type: string
        notificationType:
          type: string
        referenceType:
          type: string
        referenceId:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
