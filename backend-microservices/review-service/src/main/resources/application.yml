server:
  port: 8087

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/el_db
    username: el_user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
