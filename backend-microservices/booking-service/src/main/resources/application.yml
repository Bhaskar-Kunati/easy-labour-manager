spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/el_db}
    username: ${SPRING_DATASOURCE_USERNAME:el_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

wallet:
  service:
    url: ${WALLET_SERVICE_URL:http://localhost:8089}

booking:
  wallet:
    internal-secret: ${BOOKING_TO_WALLET_INTERNAL_SECRET}
  internal:
    admin-secret: ${ADMIN_TO_BOOKING_INTERNAL_SECRET}
