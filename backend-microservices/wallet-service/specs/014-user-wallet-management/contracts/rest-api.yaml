openapi: 3.0.3
info:
  title: Wallet Service API
  version: 1.0.0
  description: API for managing user wallets, top-ups, transaction ledgers, and debits.
paths:
  /api/wallet/balance:
    get:
      summary: Get authenticated user's wallet balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  balance:
                    type: number
                    format: decimal
                  currency:
                    type: string
        '401':
          description: Unauthorized
  /api/wallet/transactions:
    get:
      summary: Get authenticated user's transaction history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Transaction history retrieved successfully
  /api/wallet/topup:
    post:
      summary: Add funds to authenticated user's wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                referenceId:
                  type: string
      responses:
        '200':
          description: Top-up successful
  /api/wallet/debit:
    post:
      summary: Internal service API to debit wallet for booking payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                amount:
                  type: number
                referenceId:
                  type: string
      responses:
        '200':
          description: Debit successful
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
